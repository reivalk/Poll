<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中正高中音樂班 122班 - 8-Bit 像素座位抽籤系統</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Pixel Fonts: DotGothic16 & Press Start 2P -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        pixel: ['"DotGothic16"', '"Press Start 2P"', 'monospace'],
                        heading: ['"Press Start 2P"', '"DotGothic16"', 'monospace'],
                    },
                    colors: {
                        pixelBlue: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            800: '#0c4a6e',
                            900: '#0f172a',
                        },
                        pixelYellow: '#fef08a',
                        pixelPink: '#fbcfe8',
                        pixelGreen: '#bbf7d0',
                    }
                }
            }
        }
    </script>

    <style>
        * {
            image-rendering: pixelated;
            font-family: 'DotGothic16', monospace;
            user-select: none;
        }

        body {
            background-color: #e0f2fe;
            background-image: 
                radial-gradient(#bae6fd 2px, transparent 2px),
                radial-gradient(#bae6fd 2px, #e0f2fe 2px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            min-height: 100vh;
        }

        /* 經典 8-Bit 像素外框 (Pixel Border Effect) */
        .pixel-card {
            background: #ffffff;
            border: 4px solid #0f172a;
            box-shadow: 
                4px 4px 0px 0px #0f172a,
                inset -4px -4px 0px 0px #cbd5e1;
            position: relative;
        }

        .pixel-card-sky {
            background: #f0f9ff;
            border: 4px solid #0f172a;
            box-shadow: 
                4px 4px 0px 0px #0f172a,
                inset -4px -4px 0px 0px #bae6fd;
        }

        .pixel-btn {
            background: #38bdf8;
            color: #0f172a;
            border: 4px solid #0f172a;
            box-shadow: 
                4px 4px 0px 0px #0f172a,
                inset -4px -4px 0px 0px #0284c7;
            transition: all 0.1s ease;
            cursor: pointer;
        }

        .pixel-btn:hover {
            background: #7dd3fc;
            transform: translate(-2px, -2px);
            box-shadow: 
                6px 6px 0px 0px #0f172a,
                inset -4px -4px 0px 0px #0284c7;
        }

        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 
                2px 2px 0px 0px #0f172a,
                inset -2px -2px 0px 0px #0284c7;
        }

        /* 學生座位卡片 */
        .pixel-seat {
            background: #ffffff;
            border: 3px solid #0f172a;
            box-shadow: 3px 3px 0px 0px #0f172a;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pixel-seat:hover {
            background: #f0f9ff;
            border-color: #0284c7;
            transform: translateY(-3px);
            box-shadow: 4px 6px 0px 0px #0284c7;
        }

        .pixel-seat.selected {
            background: #fef08a !important;
            border-color: #b45309 !important;
            box-shadow: 4px 4px 0px 0px #b45309 !important;
            animation: pixelJump 0.6s infinite alternate;
        }

        .pixel-seat.dragging {
            opacity: 0.35;
        }

        .pixel-seat.drag-over {
            background: #bae6fd !important;
            border-color: #0284c7 !important;
            transform: scale(1.03);
        }

        @keyframes pixelJump {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-4px); }
        }

        /* 專用 A4 列印樣式 */
        @media print {
            @page {
                size: A4 landscape;
                margin: 0.6cm;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .pixel-card, .pixel-seat {
                border: 2px solid #000 !important;
                box-shadow: none !important;
                background: white !important;
            }
        }
    </style>
</head>

    <script>
        // 20 位學生原始名單
        const initialStudents = [
            "于紫晴", "方怡心", "王若妤", "吳予綸", "吳佩蓁",
            "吳旂碩", "宋亭頤", "李宇涵", "林忻潼", "張又可",
            "許祐瑄", "陳少羲", "陳林靖", "曾勻欣", "黃美醇",
            "廖子緹", "蔡沁恩", "鄭旭宏", "魏貴檠", "羅立庭"
        ];

        let currentSeats = [...initialStudents];
        let selectedIndex = null;
        let dragSourceIndex = null;
        let soundEnabled = true;

        // Web Audio API 8-Bit 紅白機音效合成器
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playRetroSound(type) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.04);
                    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.04);
                } else if (type === 'swap') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(260, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(520, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);
                } else if (type === 'tick') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.02);
                } else if (type === 'fanfare') {
                    // 勝利 8-Bit 弦樂音效
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.type = 'square';
                        noteOsc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.07);
                        noteGain.gain.setValueAtTime(0.06, audioCtx.currentTime + i * 0.07);
                        noteGain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.07 + 0.09);
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        noteOsc.start(audioCtx.currentTime + i * 0.07);
                        noteOsc.stop(audioCtx.currentTime + i * 0.07 + 0.09);
                    });
                }
            } catch (e) {
                console.log('Audio disabled or blocked');
            }
        }

        // 切換聲音開關
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btnText = document.getElementById('soundText');
            const btnIcon = document.getElementById('soundIcon');
            const btn = document.getElementById('soundToggleBtn');

            if (soundEnabled) {
                btnIcon.innerText = "🔊";
                btnText.innerText = "音效 ON";
                btn.className = "pixel-btn px-3 py-1.5 bg-yellow-300 text-xs font-bold flex items-center gap-1.5 whitespace-nowrap";
                playRetroSound('click');
            } else {
                btnIcon.innerText = "🔇";
                btnText.innerText = "音效 OFF";
                btn.className = "pixel-btn px-3 py-1.5 bg-slate-300 text-xs font-bold flex items-center gap-1.5 whitespace-nowrap";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderSeats();
            document.getElementById('printDate').innerText = `列印時間：${new Date().toLocaleDateString('zh-TW')}`;
        });

        // 渲染 20 個學生座位 (5 直排 x 4 橫排，完全不帶任何第幾排第幾列欄位標籤)
        function renderSeats() {
            const grid = document.getElementById('seatingGrid');
            grid.innerHTML = '';

            currentSeats.forEach((studentName, index) => {
                const isSelected = selectedIndex === index;

                const card = document.createElement('div');
                card.className = `pixel-seat p-2 sm:p-3 text-center cursor-pointer relative flex flex-col items-center justify-center min-h-[64px] sm:min-h-[76px] ${isSelected ? 'selected' : ''}`;
                card.draggable = true;

                card.innerHTML = `
                    <div class="pointer-events-none w-full">
                        <span class="student-name font-black text-slate-900 text-sm sm:text-base tracking-wider block">
                            ${studentName}
                        </span>
                    </div>
                `;

                // 事件綁定
                card.addEventListener('click', () => handleSeatClick(index));
                card.addEventListener('dragstart', (e) => handleDragStart(e, index));
                card.addEventListener('dragover', (e) => handleDragOver(e, card));
                card.addEventListener('dragleave', () => handleDragLeave(card));
                card.addEventListener('drop', (e) => handleDrop(e, index));

                grid.appendChild(card);
            });
        }

        // 隨機抽籤動畫
        function startDrawAnimation() {
            const modal = document.getElementById('drawModal');
            const slotText = document.getElementById('shuffleSlotText');
            const progressBar = document.getElementById('drawProgressBar');

            modal.classList.remove('hidden');
            selectedIndex = null;

            let step = 0;
            const totalSteps = 28;

            const timer = setInterval(() => {
                step++;
                const randIndex = Math.floor(Math.random() * initialStudents.length);
                slotText.innerText = initialStudents[randIndex];
                progressBar.style.width = `${(step / totalSteps) * 100}%`;
                
                playRetroSound('tick');

                if (step >= totalSteps) {
                    clearInterval(timer);
                    setTimeout(() => {
                        modal.classList.add('hidden');
                        executeShuffle();
                        playRetroSound('fanfare');
                        triggerConfetti();
                        showToast('🎉 抽籤完成！20 位同學座位已重新分配');
                    }, 120);
                }
            }, 60);
        }

        // 隨機洗牌算法 (Fisher-Yates Shuffle)
        function executeShuffle() {
            const array = [...initialStudents];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            currentSeats = array;
            renderSeats();

            const badge = document.getElementById('statusBadge');
            badge.className = "bg-emerald-100 border-2 border-slate-900 px-3 py-1.5 font-bold text-emerald-900";
            badge.innerText = "✓ 已完成隨機抽籤";
        }

        // 恢復預設名單
        function resetToInitial() {
            currentSeats = [...initialStudents];
            selectedIndex = null;
            renderSeats();
            playRetroSound('click');
            showToast('已恢復預設名單順序');

            const badge = document.getElementById('statusBadge');
            badge.className = "bg-emerald-100 border-2 border-slate-900 px-3 py-1.5 font-bold text-emerald-900";
            badge.innerText = "⚡ 預設順序";
        }

        // 點擊交換座位處理
        function handleSeatClick(index) {
            playRetroSound('click');

            if (selectedIndex === null) {
                selectedIndex = index;
                renderSeats();
                showToast(`已選擇 [${currentSeats[index]}]，請點擊另一位同學進行對調`);
            } else if (selectedIndex === index) {
                selectedIndex = null;
                renderSeats();
            } else {
                const studentA = currentSeats[selectedIndex];
                const studentB = currentSeats[index];

                [currentSeats[selectedIndex], currentSeats[index]] = [currentSeats[index], currentSeats[selectedIndex]];
                
                selectedIndex = null;
                renderSeats();
                playRetroSound('swap');
                showToast(`成功對調：[${studentA}] ↔ [${studentB}]`);
            }
        }

        // 拖曳對調處理 (Drag & Drop)
        function handleDragStart(e, index) {
            dragSourceIndex = index;
            e.currentTarget.classList.add('dragging');
        }

        function handleDragOver(e, card) {
            e.preventDefault();
            card.classList.add('drag-over');
        }

        function handleDragLeave(card) {
            card.classList.remove('drag-over');
        }

        function handleDrop(e, targetIndex) {
            e.preventDefault();
            if (dragSourceIndex === null || dragSourceIndex === targetIndex) return;

            const studentA = currentSeats[dragSourceIndex];
            const studentB = currentSeats[targetIndex];

            [currentSeats[dragSourceIndex], currentSeats[targetIndex]] = [currentSeats[targetIndex], currentSeats[dragSourceIndex]];

            dragSourceIndex = null;
            selectedIndex = null;
            renderSeats();
            playRetroSound('swap');
            showToast(`拖曳對調：[${studentA}] ↔ [${studentB}]`);
        }

        // 搜尋學生功能 (高亮黃色外框)
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const cards = document.querySelectorAll('.pixel-seat');

            cards.forEach(card => {
                const nameEl = card.querySelector('.student-name');
                const nameText = nameEl.innerText.toLowerCase();

                if (query === '' || nameText.includes(query)) {
                    card.style.opacity = '1';
                    if (query !== '' && nameText.includes(query)) {
                        card.style.backgroundColor = '#fef08a';
                        card.style.borderColor = '#b45309';
                    } else {
                        card.style.backgroundColor = '';
                        card.style.borderColor = '';
                    }
                } else {
                    card.style.opacity = '0.25';
                    card.style.backgroundColor = '';
                    card.style.borderColor = '';
                }
            });
        }

        // 匯出 CSV 檔案
        function exportCSV() {
            let csvContent = "\uFEFF座位編號,學生姓名\n";
            currentSeats.forEach((student, idx) => {
                csvContent += `"${idx + 1}","${student}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `中正高中音樂班122班_座位表.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('已匯出 CSV 檔案！');
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.6 }
                });
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;

            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 2400);
        }
    </script>
</body>
</html>
